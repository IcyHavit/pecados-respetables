  <style>

    .brand{font-family:Georgia,serif;font-size:1.08rem;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.tool,.nav-btn{min-width:48px;min-height:48px;border:1px solid #ffffff2c;background:#ffffff0d;color:#fff;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .2s,transform .2s}.tool:hover,.nav-btn:hover{background:#ffffff1d}.tool:active,.nav-btn:active{transform:scale(.97)}.tool svg,.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.text-tool{padding:0 15px;font-weight:700}.font-compact{display:none}.progress-wrap{flex:1;max-width:360px;display:flex;align-items:center;gap:12px}.progress-track{height:5px;background:#ffffff26;border-radius:99px;overflow:hidden;flex:1}.progress-fill{height:100%;background:var(--gold);width:0;transition:width .35s ease}.counter{font-size:.88rem;font-weight:700;min-width:54px;text-align:right;color:#f4eadb}

    .cover-spread{height:100%;display:grid;grid-template-columns:1fr 1.05fr}.cover-copy{padding:clamp(36px,6vw,84px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 10% 8%,#55a7d950,transparent 28%),linear-gradient(145deg,#fbfdff,#e5f2fa)}.kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);font-size:.88rem}.cover-copy h1{font-family:Georgia,serif;font-size:clamp(3.1rem,6vw,6rem);line-height:.92;margin:.28em 0;color:var(--aubergine);max-width:700px}.cover-copy p{max-width:620px;font-size:1.08rem;line-height:1.7;color:#36536a;margin:0 0 28px}.cover-art{background:#edf7fc;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}.cover-art:before{content:"";position:absolute;width:120%;height:30%;background:#55a7d918;transform:rotate(-30deg)}.cover-art img{max-width:74%;max-height:84%;object-fit:contain;filter:drop-shadow(0 24px 24px #0a2f5344);position:relative}.start{align-self:flex-start;min-height:54px;border:0;border-radius:12px;background:var(--aubergine);color:#fff;padding:14px 22px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px}.start:hover{background:#125181}.start svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2}

    .zoom-dialog{position:fixed;inset:0;z-index:70;background:#061827f2;display:none;grid-template-rows:72px minmax(0,1fr);color:#fff}.zoom-dialog.open{display:grid}.zoom-toolbar{display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,34px);border-bottom:1px solid #ffffff26}.zoom-title{font-family:Georgia,serif;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zoom-controls{display:flex;gap:8px;margin-left:auto}.zoom-btn{min-width:48px;height:48px;border:2px solid transparent;border-radius:10px;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 3px 10px #0004}.zoom-btn:hover{filter:brightness(1.12)}#zoomOut{background:#c37b16;border-color:#f0b456}#zoomReset{background:#536b7c;border-color:#7890a1}#zoomIn{background:#1684b7;border-color:#58bde8}#zoomClose{background:#b93742;border-color:#f0878f}.zoom-stage{overflow:auto;padding:28px;display:grid;align-items:start;justify-items:center}.zoom-stage img{display:block;width:min(1600px,100%);height:auto;transform-origin:top center;transition:width .18s ease;background:#fff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    @media(max-width:900px){body{overflow:auto}.shell{min-height:100dvh;height:auto;grid-template-rows:64px auto 70px}.reader{padding:0;min-height:calc(100dvh - 134px)}.book{border-radius:0;min-height:calc(100dvh - 134px)}.spread{grid-template-columns:1fr;height:auto;min-height:calc(100dvh - 134px)}.art-page{min-height:48dvh;padding:16px}.art{max-height:44dvh}.notes{overflow:visible;padding:28px 24px;min-height:45dvh}.reflection{margin-top:28px}.cover-spread{grid-template-columns:1fr;min-height:calc(100dvh - 134px)}.cover-copy{padding:32px 26px}.cover-art{order:-1;min-height:40dvh;padding:20px}.cover-art img{max-height:36dvh}.steps{grid-template-columns:1fr}.welcome{min-height:calc(100dvh - 134px);padding:32px 24px}.brand{display:none}.progress-wrap{max-width:none}.font-wide{display:none}.font-compact{display:inline}.text-tool{padding:0;width:48px}.page-title-small{display:none}.center-nav{gap:8px}.nav-label{display:none}.nav-btn{padding:0;width:50px}.bottombar{padding:0 14px}.zoom-stage{padding:12px}.zoom-title{max-width:40vw}}

<body>
  <div class="shell">

      <div class="top-actions">
        <button class="tool text-tool" id="fontBtn" type="button" aria-label="Aumentar tamaño de texto" title="Aumentar texto"><span class="font-wide">Aumentar texto +</span><span class="font-compact" aria-hidden="true">A+</span></button>
        <button class="tool" id="fullscreenBtn" type="button" aria-label="Ver en pantalla completa" title="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
        <button class="tool" id="tocBtn" type="button" aria-label="Abrir índice" title="Índice"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
      </div>
    </header>
    <main class="reader"><div class="book" id="book" aria-live="polite"></div></main>

      <button class="nav-btn" id="prevBtn" type="button"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span class="nav-label">Anterior</span></button>

  </div>
  <div class="overlay" id="tocOverlay" aria-hidden="true"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="tocHeading"><div class="drawer-head"><h2 id="tocHeading">Contenido</h2><button class="close" id="tocClose" type="button" aria-label="Cerrar índice">×</button></div><nav class="toc" id="toc"></nav></aside></div>
  <div class="zoom-dialog" id="zoomDialog" role="dialog" aria-modal="true" aria-labelledby="zoomTitle" aria-hidden="true"><div class="zoom-toolbar"><div class="zoom-title" id="zoomTitle"></div><div class="zoom-controls"><button class="zoom-btn" id="zoomOut" type="button" aria-label="Alejar">−</button><button class="zoom-btn" id="zoomReset" type="button" aria-label="Restablecer zoom">100%</button><button class="zoom-btn" id="zoomIn" type="button" aria-label="Acercar">+</button><button class="zoom-btn" id="zoomClose" type="button" aria-label="Cerrar ampliación">×</button></div></div><div class="zoom-stage" id="zoomStage"><img id="zoomImage" alt=""></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const I='chapters/';
    const pages=[
      {type:'cover',title:'Portada',image:I+'portada-pecados-respetables.webp'},
      {type:'welcome',title:'Cómo usar este libro'},
      {title:'Santos comunes y corrientes',chapter:'Capítulo 1 · Nuestra identidad en Cristo',verse:'Vive como lo que eres.',image:I+'capitulo-01-santos-comunes.webp',summary:'La santidad bíblica no es un premio reservado para creyentes extraordinarios, sino la posición de todo aquel que ha sido apartado para Dios y comprado por Cristo. Aunque la lucha con el pecado continúa, nuestra nueva identidad nos llama a rechazar toda conducta indigna de un santo y a vivir de acuerdo con lo que ya somos.',question:'Si mi conducta fuera evaluada como “digna de un santo”, ¿qué hábito cotidiano tendría que reconocer y cambiar hoy?'},
      {title:'La desaparición del pecado',chapter:'Capítulo 2 · Recuperar el lenguaje bíblico',verse:'El que guarda toda la ley, pero ofende en un punto, se hace culpable de todos. — Santiago 2:10',image:I+'capitulo-02-desaparicion-pecado.webp',summary:'La cultura ha suavizado o eliminado la palabra pecado, y esa tendencia también puede entrar en la iglesia. Mientras señalamos las faltas visibles de otros, solemos tolerar orgullo, chisme, impaciencia, enojo o amargura. Ante Dios, toda infracción de su ley necesita arrepentimiento y la gracia redentora de Cristo.',question:'¿Qué pecado “respetable” he minimizado con palabras más suaves o comparándolo con las faltas de otros?'},
      {title:'La malignidad del pecado',chapter:'Capítulo 3 · Una malignidad moral',verse:'El pecado es transgresión de la ley. — 1 Juan 3:4',image:I+'capitulo-03-malignidad-pecado.webp',summary:'El pecado se parece a un cáncer moral: nace en el interior, se extiende y termina dañando también a quienes nos rodean. Ninguna falta es inocente; cada una desafía la autoridad de Dios, menosprecia su ley, entristece al Espíritu Santo y ocurre delante de su presencia. Lo sutil también puede escalar si se deja sin tratar.',question:'¿Qué actitud, palabra o reacción aparentemente pequeña está comenzando a extenderse en mi vida o a afectar a otros?'},
      {title:'El remedio para el pecado',chapter:'Capítulo 4 · El evangelio diario',verse:'El Señor cargó en Él el pecado de todos nosotros. — Isaías 53:6',image:I+'capitulo-04-remedio-pecado.webp',summary:'El evangelio no es solamente la puerta de entrada a la fe: es la provisión diaria para reconocer y combatir el pecado sin excusas ni desesperación. La certeza de que Cristo cargó nuestra culpa nos permite confesar con honestidad, acercarnos a Dios como Padre y obedecer movidos por amor y gratitud. Por eso necesitamos predicarnos el evangelio cada día.',question:'¿Qué pecado puedo confesar hoy con sinceridad, descansando en que Cristo ya cargó mi culpa y me acompaña en la lucha?'},
      {title:'El poder del Espíritu Santo',chapter:'Capítulo 5 · Responsabilidad dependiente',verse:'Anden por el Espíritu, y no satisfagan los deseos de la carne. — Gálatas 5:16',image:I+'capitulo-05-poder-espiritu.webp',summary:'Cristo nos libera de una vez del dominio reinante del pecado y continúa librándonos progresivamente de su actividad. En esta guerra diaria somos cien por ciento responsables de obedecer y, al mismo tiempo, cien por ciento dependientes del Espíritu Santo. Él ilumina la conciencia, fortalece la voluntad y usa las circunstancias para conformarnos a la imagen de Cristo.',question:'¿En qué área necesito asumir mi responsabilidad y, a la vez, pedir con humildad el poder del Espíritu Santo?' }
    ];
    const book=document.getElementById('book'),counter=document.getElementById('counter'),progressFill=document.getElementById('progressFill'),shortTitle=document.getElementById('shortTitle');
    const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),tocOverlay=document.getElementById('tocOverlay'),toc=document.getElementById('toc');
    const zoomDialog=document.getElementById('zoomDialog'),zoomImage=document.getElementById('zoomImage'),zoomTitle=document.getElementById('zoomTitle'),zoomStage=document.getElementById('zoomStage');
    let current=0,fontStep=0,zoom=100,speaking=false;
    const icon=name=>({play:'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>',zoom:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></svg>',sound:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>'}[name]);
    function cover(){return '<section class="cover-spread"><div class="cover-copy"><div class="kicker">Guía visual interactiva</div><h1>Pecados respetables</h1><p>Un recorrido claro para reconocer los pecados que solemos tolerar, llevarlos a la cruz y aprender a combatirlos con el evangelio y el poder del Espíritu Santo.</p><button class="start" type="button" data-go="1">Comenzar lectura'+icon('play')+'</button></div><div class="cover-art"><img src="'+pages[0].image+'" alt="Portada mejorada de Pecados respetables, de Jerry Bridges"></div></section>'}
    function welcome(){return '<section class="welcome"><div class="welcome-inner"><div class="kicker">Antes de comenzar</div><h1>Lee, reconoce y reflexiona</h1><p>Cada capítulo conserva su lámina visual y añade una síntesis legible, una pregunta de reflexión y herramientas sencillas para ampliar o escuchar el contenido.</p><div class="steps"><div class="step"><strong>1. Observa</strong><span>Recorre la lámina y reconoce la idea central del capítulo.</span></div><div class="step"><strong>2. Amplía</strong><span>Usa el zoom para leer cada detalle con comodidad.</span></div><div class="step"><strong>3. Responde</strong><span>Termina con una pregunta para examinar tu vida a la luz del evangelio.</span></div></div><button class="start" type="button" data-go="2">Ir al primer capítulo'+icon('play')+'</button></div></section>'}
    function chapter(p,i){return '<section class="spread"><div class="art-page"><div class="art-frame"><img class="art" src="'+p.image+'" alt="Lámina visual: '+p.title+'" data-zoom><button class="zoom-hint" type="button" data-zoom>Ampliar imagen</button></div></div><article class="notes"><div class="chapter-no">'+p.chapter+'</div><h1>'+p.title+'</h1><p class="verse">'+p.verse+'</p><p class="summary">'+p.summary+'</p><div class="reflection"><div class="reflection-card"><div class="reflection-label">Para reflexionar</div><p class="question">'+p.question+'</p></div><div class="page-actions"><button class="action primary" type="button" data-zoom>'+icon('zoom')+' Ver en grande</button><button class="action" type="button" data-listen>'+icon('sound')+' Escuchar resumen</button></div></div></article></section>'}
    function render(){const p=pages[current];book.innerHTML=p.type==='cover'?cover():p.type==='welcome'?welcome():chapter(p,current);counter.textContent=(current+1)+' / '+pages.length;progressFill.style.width=((current+1)/pages.length*100)+'%';shortTitle.textContent=p.title;prevBtn.disabled=current===0;nextBtn.disabled=current===pages.length-1;nextBtn.querySelector('.nav-label').textContent=current===pages.length-2?'Finalizar':'Siguiente';history.replaceState(null,'','#pagina-'+(current+1));document.title=p.title+' — Pecados respetables';updateToc();book.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));book.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=openZoom);book.querySelectorAll('[data-listen]').forEach(b=>b.onclick=listen)}
    function go(index){if(index<0||index>=pages.length||index===current)return;stopSpeech();const spread=book.firstElementChild;const cls=index>current?'leaving-next':'leaving-prev';spread.classList.add(cls);setTimeout(()=>{current=index;render()},180)}
    function buildToc(){toc.innerHTML=pages.map((p,i)=>'<button type="button" class="toc-item" data-index="'+i+'"><span class="toc-num">'+String(i+1).padStart(2,'0')+'</span><span class="toc-name">'+p.title+'<span class="toc-note">'+(p.chapter||(i===0?'Inicio':'Orientación'))+'</span></span></button>').join('');toc.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeToc();go(Number(b.dataset.index))})}
    function updateToc(){toc.querySelectorAll('.toc-item').forEach((el,i)=>el.classList.toggle('current',i===current))}
    function openToc(){tocOverlay.classList.add('open');tocOverlay.setAttribute('aria-hidden','false');document.getElementById('tocClose').focus()}
    function closeToc(){tocOverlay.classList.remove('open');tocOverlay.setAttribute('aria-hidden','true');document.getElementById('tocBtn').focus()}
    function openZoom(){const p=pages[current];if(!p.image)return;zoom=100;zoomImage.src=p.image;zoomImage.alt='Vista ampliada de '+p.title;zoomTitle.textContent=p.title;applyZoom();zoomDialog.classList.add('open');zoomDialog.setAttribute('aria-hidden','false');zoomStage.scrollTo(0,0);document.getElementById('zoomClose').focus()}
    function closeZoom(){zoomDialog.classList.remove('open');zoomDialog.setAttribute('aria-hidden','true');zoomImage.src=''}
    function applyZoom(){zoomImage.style.width=zoom+'%';document.getElementById('zoomReset').textContent=zoom+'%'}
    function listen(){const p=pages[current];if(!('speechSynthesis'in window)){showToast('La lectura en voz alta no está disponible en este navegador.');return}if(speaking){stopSpeech();showToast('Lectura detenida.');return}const u=new SpeechSynthesisUtterance(p.title+'. '+p.summary+'. Para reflexionar: '+p.question);u.lang='es-MX';u.rate=.88;u.onend=()=>speaking=false;u.onerror=()=>speaking=false;speaking=true;speechSynthesis.speak(u);showToast('Leyendo el resumen en voz alta…')}
    function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false}
    function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2600)}
    prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);document.getElementById('tocBtn').onclick=openToc;document.getElementById('tocClose').onclick=closeToc;tocOverlay.onclick=e=>{if(e.target===tocOverlay)closeToc()};
    document.getElementById('fontBtn').onclick=()=>{fontStep=(fontStep+1)%3;document.documentElement.style.setProperty('--base-size',[18,20,22][fontStep]+'px');showToast(['Tamaño normal','Texto grande','Texto muy grande'][fontStep])};
    document.getElementById('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
    document.getElementById('zoomClose').onclick=closeZoom;document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(220,zoom+25);applyZoom()};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(75,zoom-25);applyZoom()};document.getElementById('zoomReset').onclick=()=>{zoom=100;applyZoom();zoomStage.scrollTo(0,0)};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(zoomDialog.classList.contains('open'))closeZoom();else if(tocOverlay.classList.contains('open'))closeToc();return}if(zoomDialog.classList.contains('open')||tocOverlay.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(current+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(current-1)});
    let touchStart=0;book.addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-touchStart;if(Math.abs(delta)>70)go(current+(delta<0?1:-1))},{passive:true});
    const hash=Number(location.hash.replace('#pagina-',''))-1;if(Number.isInteger(hash)&&hash>=0&&hash<pages.length)current=hash;buildToc();render();
  </script>
</body>
</html>
